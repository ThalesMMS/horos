		CED88262125064F70085A861 /* CodeSigning */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			name = CodeSigning;
			shellPath = /bin/sh;
			shellScript = "# Sign the command line helpers copied into Resources.\n#\n# Xcode signs the bundle, its frameworks and its embedded bundles; a bare\n# executable copied by Copy Bundle Resources is data to it, and codesign --deep\n# treats it the same way. dciodvfy, the DICOM validator the metadata window\n# runs, therefore shipped unsigned, and an archive containing an unsigned Mach-O\n# cannot be notarised. The helpers built by targets in this project are already\n# signed by their own targets; this covers the ones that are not.\n#\n# This is the last phase of the application target, so it runs after the\n# resources are in place and before Xcode signs the bundle around them.\nset -e\nif [ \"${CODE_SIGNING_ALLOWED:-YES}\" = \"NO\" ]; then\n    echo \"note: code signing is disabled; leaving the helpers in Resources unsigned\"\n    exit 0\nfi\n# Without both of these the path below would expand to \"/\", and this walks a\n# directory tree signing what it finds. Refuse rather than guess.\nif [ -z \"${TARGET_BUILD_DIR:-}\" ] || [ -z \"${UNLOCALIZED_RESOURCES_FOLDER_PATH:-}\" ]; then\n    echo \"error: this phase needs TARGET_BUILD_DIR and UNLOCALIZED_RESOURCES_FOLDER_PATH; run it from Xcode\" >&2\n    exit 1\nfi\nresources=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\ncase \"$resources\" in\n    \"$TARGET_BUILD_DIR\"/?*) ;;\n    *) echo \"error: refusing to sign outside the build directory: $resources\" >&2; exit 1 ;;\nesac\n[ -d \"$resources\" ] || exit 0\n# EXPANDED_CODE_SIGN_IDENTITY is the identity itself, or \"-\" for ad hoc; the\n# _NAME beside it is the display name, which codesign cannot look up.\nidentity=\"${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}\"\n[ -n \"$identity\" ] || identity=\"-\"\nfind \"$resources\" -type f -perm -u+x -exec /bin/sh -c '\n    identity=\"$1\"; shift\n    for file do\n        case \"$(/usr/bin/file -b \"$file\")\" in\n            *Mach-O*)\n                /usr/bin/codesign --force --sign \"$identity\" --options runtime \"$file\" || exit 1\n                ;;\n        esac\n    done\n' _ \"$identity\" {} +\n";
		};
